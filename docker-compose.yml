services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple_crud_app
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: simple_crud
      DB_USERNAME: app_user
      DB_PASSWORD: "@Master123"

  db:
    image: mysql:8.4
    container_name: simple_crud_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: simple_crud
      MYSQL_USER: app_user
      MYSQL_PASSWORD: "@Master123"
      MYSQL_ROOT_PASSWORD: "rootpassword"
    ports:
      - "3307:3306"
    volumes:
      - simple_crud_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp_user", "-p@Master123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  simple_crud_mysql: